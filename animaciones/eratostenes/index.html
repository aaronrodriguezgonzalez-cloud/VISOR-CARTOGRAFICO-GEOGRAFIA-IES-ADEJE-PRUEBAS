<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ANAMBRO · Eratóstenes y la medida de la Tierra</title>
<style>
:root{--ink:#edf8ff;--muted:#a9c0cf;--bg:#06121d;--panel:#0d2232;--gold:#ffe27a;--sun:#ffd35c;--accent:#ff996b;--green:#78aa6c;--blue:#2b7ba5}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Inter,Montserrat,system-ui,sans-serif;color:var(--ink)}button,input{font:inherit}.app{height:100%;display:grid;grid-template-rows:48px minmax(0,1fr) 46px}.top{display:flex;align-items:center;gap:10px;padding:7px 12px;background:#091a28;border-bottom:1px solid #29485e}.brand{font-weight:950;letter-spacing:.06em}.brand span{color:#70d0c2}.title{flex:1;text-align:center;font-size:13px;font-weight:850}.controls{display:flex;gap:5px}.controls button,.stepBtn{border:1px solid #45687e;background:#102b3e;color:#fff;border-radius:7px;padding:6px 9px;font-weight:800;cursor:pointer}.controls button:hover,.stepBtn:hover,.stepBtn.active{background:#14506d}.stage{display:grid;grid-template-columns:minmax(0,1fr) 315px;gap:8px;padding:8px;min-height:0}.visual{position:relative;overflow:hidden;border:1px solid #29485e;border-radius:14px;background:radial-gradient(circle at 50% 14%,#18364b 0,#091827 48%,#050d16 100%)}.stars{position:absolute;inset:0;opacity:.35;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:73px 61px}.side{overflow:auto;border:1px solid #29485e;border-radius:14px;background:var(--panel);padding:14px}.side h2{margin:0 0 8px;font-size:18px}.side p{font-size:12px;line-height:1.5;color:#d4e6f0}.quote{margin:12px 0;padding:10px;border-left:3px solid var(--gold);background:#102c3f;border-radius:8px;font-size:12px;line-height:1.45}.fact{margin-top:10px;padding:9px;border:1px solid #31556b;background:#0a1b29;border-radius:9px;font-size:11px;line-height:1.4;color:#cfe4ef}.math{margin-top:12px;padding:10px;border:1px solid #45687e;border-radius:10px;background:#081722}.eq{font-size:19px;font-weight:950;color:var(--gold);margin:5px 0}.small{font-size:10px;color:var(--muted);line-height:1.35}.try{margin-top:12px;border-top:1px solid #36566b;padding-top:10px}.tryGrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.try input{width:100%;padding:6px;border-radius:6px;border:1px solid #45687e;background:#06121d;color:#fff}.calcBtn{width:100%;margin-top:7px;border:0;border-radius:7px;padding:7px;background:#0f766e;color:#fff;font-weight:900;cursor:pointer}.result{margin-top:7px;font-weight:950;color:var(--gold)}.bottom{display:flex;align-items:center;gap:5px;padding:7px 10px;background:#091a28;border-top:1px solid #29485e;overflow-x:auto}.stepBtn{white-space:nowrap;font-size:9.5px}.caption{position:absolute;z-index:5;left:14px;right:14px;bottom:14px;background:rgba(3,12,20,.88);border:1px solid rgba(153,204,233,.35);border-radius:11px;padding:9px 11px;text-align:center;font-size:12px;font-weight:820;line-height:1.35}.label{fill:#fff;paint-order:stroke;stroke:#06101a;stroke-width:4;font-size:13px;font-weight:850}.subLabel{fill:#cfe9f7;paint-order:stroke;stroke:#06101a;stroke-width:3;font-size:10px;font-weight:750}.gold{fill:var(--gold);paint-order:stroke;stroke:#06101a;stroke-width:4;font-weight:950}.earth{fill:var(--blue);stroke:#c9efff;stroke-width:3}.land{fill:var(--green)}.city{filter:drop-shadow(0 0 6px rgba(255,255,255,.5))}.ray{stroke:var(--gold);stroke-width:3;stroke-dasharray:12 9;animation:rays 1.8s linear infinite}.radius{stroke:#ddecf5;stroke-width:2.5;stroke-dasharray:6 5}.gnomon{stroke:#fff;stroke-width:5;stroke-linecap:round}.shadow{stroke:#16222b;stroke-width:7;stroke-linecap:round}.angle{fill:none;stroke:#ffbf43;stroke-width:4}.hidden{display:none!important}.seasonBadge{fill:#102f42;stroke:#65b9d5;stroke-width:1}.seasonText{fill:#eaf7ff;font-size:11px;font-weight:850}.wedge{fill:rgba(255,210,80,.25);stroke:#ffd45e;stroke-width:2}.glow{filter:drop-shadow(0 0 14px rgba(255,211,92,.5))}@keyframes rays{to{stroke-dashoffset:-42}}
@media(max-width:850px){.stage{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}.side{max-height:31vh}.title{font-size:11px}.caption{font-size:10px}.visual svg{min-height:370px}.app{grid-template-rows:46px minmax(0,1fr) 45px}}
</style></head><body><div class="app">
<header class="top"><div class="brand">ANAMBRO <span>· aula</span></div><div class="title">Eratóstenes y la medida de la Tierra</div><div class="controls"><button id="play">▶ Explicación</button><button id="pause">⏸</button><button id="restart">↺</button></div></header>
<main class="stage"><section class="visual"><div class="stars"></div>
<svg viewBox="0 0 980 590" width="100%" height="100%" aria-label="Animación del método de Eratóstenes">
 <g id="earthBase"><circle class="earth" cx="520" cy="338" r="205"/><path class="land" d="M392 252 C422 214 471 204 506 219 C543 234 569 214 610 239 C649 263 686 298 670 340 C655 381 611 391 585 427 C558 466 513 471 480 444 C452 421 445 391 408 374 C369 357 358 314 377 282 Z"/></g>
 <g id="alexandria"><circle class="city" cx="494.3" cy="134.6" r="7" fill="#ff996b"/><text class="label" x="424" y="118">Alejandría</text></g>
 <g id="syene" class="hidden"><circle class="city" cx="520" cy="133" r="7" fill="#ffd35c"/><text class="label" x="534" y="124">Siene (actual Asuán)</text></g>
 <g id="season" class="hidden"><rect class="seasonBadge" x="680" y="34" width="268" height="34" rx="17"/><text class="seasonText" x="814" y="56" text-anchor="middle">Solsticio de verano · mediodía solar</text></g>
 <g id="sunRays" class="hidden"><circle class="glow" cx="520" cy="54" r="42" fill="#ffd35c"/><circle cx="520" cy="54" r="30" fill="#ffe78d"/><text x="520" y="60" text-anchor="middle" fill="#654d00" font-size="14" font-weight="950">SOL</text><line class="ray" x1="420" y1="100" x2="420" y2="255"/><line class="ray" x1="470" y1="100" x2="470" y2="255"/><line class="ray" x1="494.3" y1="100" x2="494.3" y2="255"/><line class="ray" x1="520" y1="100" x2="520" y2="255"/><line class="ray" x1="570" y1="100" x2="570" y2="255"/><line class="ray" x1="620" y1="100" x2="620" y2="255"/></g>
 <g id="sticks" class="hidden"><line class="gnomon" x1="494.3" y1="134.6" x2="487.8" y2="83.0"/><line class="shadow" x1="494.3" y1="134.6" x2="526" y2="130.6"/><line class="gnomon" x1="520" y1="133" x2="520" y2="81"/><text class="subLabel" x="404" y="168">Alejandría · sombra visible</text><text class="subLabel" x="548" y="157">Siene · sombra casi nula</text></g>
 <g id="localMeasure" class="hidden"><line class="gnomon" x1="494.3" y1="134.6" x2="487.8" y2="83.0"/><line class="shadow" x1="494.3" y1="134.6" x2="526" y2="130.6"/><line x1="494.3" y1="134.6" x2="494.3" y2="78.6" stroke="#ffe27a" stroke-width="2" stroke-dasharray="5 4"/><line x1="494.3" y1="134.6" x2="487.3" y2="78.6" stroke="#ffe27a" stroke-width="2"/><path class="angle" d="M494.3 106.6 A28 28 0 0 0 490.8 106.8"/><text class="gold" x="420" y="92" font-size="20">7,2°</text><text class="subLabel" x="399" y="74">ángulo medido en Alejandría</text></g>
 <g id="projection" class="hidden"><line class="radius" x1="520" y1="338" x2="520" y2="133"/><line class="radius" x1="520" y1="338" x2="494.3" y2="134.6"/><circle cx="520" cy="338" r="5" fill="#fff"/><path class="angle" d="M520 282 A56 56 0 0 0 512.5 282.5"/><text class="gold" x="463" y="272" font-size="20">7,2°</text><text class="label" x="540" y="359">Centro de la Tierra</text><circle cx="802" cy="338" r="98" fill="none" stroke="#8eb6c8" stroke-width="3"/><path class="wedge" d="M802 338 L802 240 A98 98 0 0 1 814.3 240.8 Z"/><text class="gold" x="802" y="329" text-anchor="middle" font-size="22">360°</text><text class="label" x="802" y="356" text-anchor="middle">7,2° = 1/50</text><text class="subLabel" x="802" y="376" text-anchor="middle">360 ÷ 7,2 = 50</text></g>
 <g id="finalCalc" class="hidden"><text class="gold" x="520" y="285" text-anchor="middle" font-size="28">≈ 800 km × 50</text><text class="gold" x="520" y="330" text-anchor="middle" font-size="36">≈ 40.000 km</text><text class="label" x="520" y="370" text-anchor="middle">circunferencia terrestre</text></g>
</svg><div id="caption" class="caption"></div></section>
<aside class="side"><h2 id="sideTitle"></h2><p id="sideText"></p><div class="quote" id="quote"></div><div class="fact" id="fact"></div><div class="math hidden" id="mathBox"><div class="eq">7,2° = 1/50 de 360°</div><div class="eq">800 km × 50 ≈ 40.000 km</div></div><div class="try hidden" id="tryBox"><b>🧠 Hazlo tú</b><p>Cambia el ángulo o la distancia y comprueba la proporción.</p><div class="tryGrid"><label><span class="small">Ángulo (°)</span><input id="angleInput" type="number" value="7.2" step="0.1"></label><label><span class="small">Distancia (km)</span><input id="distInput" type="number" value="800" step="10"></label></div><button class="calcBtn" id="calc">Calcular circunferencia</button><div class="result" id="result">≈ 40.000 km</div></div></aside></main>
<footer class="bottom"><button class="stepBtn active" data-step="0">1 · Alejandría</button><button class="stepBtn" data-step="1">2 · Siene</button><button class="stepBtn" data-step="2">3 · Rayos</button><button class="stepBtn" data-step="3">4 · Sombras</button><button class="stepBtn" data-step="4">5 · 7,2°</button><button class="stepBtn" data-step="5">6 · 360°</button><button class="stepBtn" data-step="6">7 · Resultado</button></footer></div>
<script>
(()=>{const $=id=>document.getElementById(id);let step=0,timer=null;const visualIds=['syene','season','sunRays','sticks','localMeasure','projection','finalCalc'];
const steps=[
 {title:'📍 Alejandría',text:'Eratóstenes vive y trabaja en Alejandría. Empezamos únicamente aquí: una ciudad sobre una Tierra cuya medida todavía no conocemos.',cap:'Primero: Alejandría, el lugar desde el que Eratóstenes plantea el problema.',show:[],fact:'Siglo III a. C. · Alejandría.',quote:'¿Cómo medir la Tierra sin poder verla desde fuera?'},
 {title:'📍 Siene',text:'Después situamos Siene, la actual Asuán, bastante más al sur y muy próxima al Trópico de Cáncer.',cap:'Segundo: añadimos Siene. Ahora tenemos dos lugares situados a distinta latitud.',show:['syene'],fact:'Alejandría está a mayor latitud que Siene.',quote:'La comparación entre dos ciudades permitirá detectar la curvatura.'},
 {title:'☀️ Solsticio de verano',text:'Es el solsticio de verano del hemisferio norte, hacia el mediodía solar. Los rayos del Sol llegan prácticamente paralelos: casi perpendiculares en Siene y más inclinados respecto a la vertical local en Alejandría.',cap:'Tercero: solsticio de verano y rayos paralelos. En Siene la incidencia es casi cenital; en Alejandría no.',show:['syene','season','sunRays'],fact:'La fecha es esencial: explica el Sol casi cenital de Siene.',quote:'Los rayos son paralelos; lo que cambia es la orientación de la vertical local.'},
 {title:'│ Las sombras',text:'Eratóstenes compara dos varas verticales. En Siene la sombra es prácticamente nula. En Alejandría, al estar más al norte, aparece una sombra visible.',cap:'Cuarto: aparecen los gnomones. La diferencia se hace visible mediante las sombras.',show:['syene','sunRays','sticks'],fact:'Siene: sombra casi nula · Alejandría: sombra visible.',quote:'Una sombra convierte la curvatura terrestre en algo que se puede medir.'},
 {title:'📐 La diferencia angular',text:'A partir de la altura de la vara y de la longitud de la sombra de Alejandría se obtiene un ángulo aproximado de 7,2°. El número aparece solo ahora, después de la observación.',cap:'Quinto: la diferencia medida en Alejandría es aproximadamente 7,2°.',show:['syene','localMeasure'],fact:'7,2° es una conclusión del experimento, no un dato inicial.',quote:'Primero la sombra; después el ángulo.'},
 {title:'🌍 De 7,2° a 360°',text:'Las verticales de ambas ciudades apuntan al centro de la Tierra. Con rayos solares paralelos, el ángulo de 7,2° equivale al ángulo central entre las dos ciudades. Una vuelta completa tiene 360°: 360 ÷ 7,2 = 50.',cap:'Sexto: proyectamos los 7,2° al centro y los comparamos con los 360° de la circunferencia.',show:['syene','projection'],fact:'7,2° representa 1/50 de una circunferencia completa.',quote:'La geometría local se convierte en geometría planetaria.',math:true},
 {title:'✨ La Tierra medida',text:'Si la distancia entre Alejandría y Siene se aproxima aquí a 800 km, basta multiplicar por 50: unos 40.000 km de circunferencia.',cap:'Séptimo: una distancia, una sombra y una proporción bastan para aproximar el tamaño de un planeta.',show:['finalCalc'],fact:'≈ 800 km × 50 ≈ 40.000 km.',quote:'Hace más de 2.200 años, un ser humano midió la Tierra con matemáticas elementales.',math:true,try:true}
];
function setStep(n){step=Math.max(0,Math.min(steps.length-1,n));const d=steps[step];for(const id of visualIds)$(id).classList.toggle('hidden',!d.show.includes(id));$('sideTitle').textContent=d.title;$('sideText').textContent=d.text;$('caption').textContent=d.cap;$('fact').innerHTML='<b>Clave:</b> '+d.fact;$('quote').innerHTML='<b>Idea:</b> '+d.quote;$('mathBox').classList.toggle('hidden',!d.math);$('tryBox').classList.toggle('hidden',!d.try);document.querySelectorAll('.stepBtn').forEach(b=>b.classList.toggle('active',+b.dataset.step===step))}
function stop(){if(timer){clearInterval(timer);timer=null}}function play(){stop();setStep(0);timer=setInterval(()=>{if(step>=steps.length-1){stop();return}setStep(step+1)},4200)}document.querySelectorAll('.stepBtn').forEach(b=>b.onclick=()=>{stop();setStep(+b.dataset.step)});$('play').onclick=play;$('pause').onclick=stop;$('restart').onclick=()=>{stop();setStep(0)};$('calc').onclick=()=>{const a=+$('angleInput').value,d=+$('distInput').value;if(!(a>0&&a<360&&d>0)){$('result').textContent='Introduce valores válidos.';return}$('result').textContent='≈ '+Math.round(d*360/a).toLocaleString('es-ES')+' km'};setStep(0)})();
</script></body></html>
